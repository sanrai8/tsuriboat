<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>若狭釣果まとめ</title>
<meta name="theme-color" content="#0F2033">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1>若狭釣果まとめ</h1>
  <p class="updated" id="updated">読み込み中</p>
</header>

<nav class="filters" aria-label="絞り込み">
  <div class="chips" id="area-chips" role="group" aria-label="エリア"></div>
  <div class="chips" id="species-chips" role="group" aria-label="魚種"></div>
</nav>

<main id="app">
  <section class="tonight" id="tonight" hidden>
    <h2>船ごとの最新</h2>
    <ul class="boat-latest" id="boat-latest"></ul>
  </section>

  <section class="timeline">
    <h2>釣果一覧</h2>
    <ol class="days" id="days"></ol>
    <p class="empty" id="empty" hidden>
      条件に合う釣果がまだありません。<br>
      GitHub Actions の初回実行後に表示されます。
    </p>
  </section>
</main>

<footer class="foot">
  <p>各船の公開ブログから自動収集し、AIで数値を抽出しています。正確な情報は各船のページで確認してください。</p>
  <p id="version">v0.1.0</p>
</footer>

<script src="app.js"></script>
</body>
</html>
